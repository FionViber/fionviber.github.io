name: Build the directory and collect the static releases
on:
  push:
    branches: [directory-layout-20261125]
    paths: ['.github/workflows/directory-review-20261125.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and build both directory editions
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build
          npm run sync:github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish the updated directory layout for all routes and languages'
          git push origin HEAD:directory-layout-20261125
      - name: Collect verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/codexinternal"
          (cd dist/cloudflare && zip -q -r "$RUNNER_TEMP/codexinternal/directory.zip" .)
          for name in qr-code zacktools; do
            id=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45442012104/artifacts --jq ".artifacts[] | select(.name=="$name") | .id")
            test -n "$id"
            gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/"$id"/zip > "$RUNNER_TEMP/codexinternal/$name.zip"
            unzip -tq "$RUNNER_TEMP/codexinternal/$name.zip"
          done
          for name in directory qr-code zacktools; do
            object=$(git hash-object -w "$RUNNER_TEMP/codexinternal/$name.zip")
            printf '100644 blob %s\t%s.zip\n' "$object" "$name"
          done > "$RUNNER_TEMP/codexinternal/tree.txt"
          tree=$(git mktree < "$RUNNER_TEMP/codexinternal/tree.txt")
          commit=$(git commit-tree "$tree" -m 'Temporary verified Pages packages')
          git push origin "$commit:refs/heads/pages-review-artifacts-20261125"
